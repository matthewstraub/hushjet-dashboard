services:
  - type: web
    name: hushjet-dashboard
    runtime: node
    plan: free
    # db:push applies the migrations in drizzle/ to DATABASE_URL.
    buildCommand: pnpm install && pnpm build && pnpm db:push
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: VIEWER_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # For the dashboard's live reading. The token from `hushjet login` in cli/.
      - key: DYSON_TOKEN
        sync: false
