# Render doesn't read this file. Like the PetLibro and Dexcom services,
# hushjet-dashboard was created in the dashboard, in Matt's Projects →
# Production. This records the same settings, so a Blueprint made from it
# would match the live service.
services:
  - type: web
    name: hushjet-dashboard
    runtime: node
    plan: free
    region: oregon
    branch: main
    # db:push applies the migrations in drizzle/ to DATABASE_URL.
    buildCommand: pnpm install --frozen-lockfile && pnpm run build && pnpm run db:push
    startCommand: pnpm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: VIEWER_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # For live readings and copying Dyson's history. The token from `hushjet login` in cli/.
      - key: DYSON_TOKEN
        sync: false
